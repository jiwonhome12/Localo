name: Notion 작업 보드에 커밋 기록

on:
  push:
    branches:
      - '**'

jobs:
  log-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 커밋 정보를 작업 보드에 기록
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 'e31e8ea9-ee8e-4243-abbb-9bc73b3f9952'
        with:
          script: |
            const { NOTION_TOKEN, NOTION_DATABASE_ID } = process.env;
            const branch = context.ref.replace('refs/heads/', '');
            const commits = context.payload.commits || [];

            for (const commit of commits) {
              const authorName = commit.author.name;
              const firstLine = commit.message.split('\n')[0].slice(0, 180);
              const title = `[${authorName}] ${firstLine}`;

              const res = await fetch('https://api.notion.com/v1/pages', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${NOTION_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Notion-Version': '2022-06-28',
                },
                body: JSON.stringify({
                  parent: { database_id: NOTION_DATABASE_ID },
                  properties: {
                    '작업 이름': { title: [{ text: { content: title } }] },
                    '브랜치': { rich_text: [{ text: { content: branch } }] },
                    '커밋 링크': { url: commit.url },
                    '커밋 날짜': { date: { start: commit.timestamp.slice(0, 10) } },
                  },
                }),
              });

              if (!res.ok) {
                const body = await res.text();
                core.warning(`Notion 기록 실패 (${commit.id.slice(0, 7)}): ${res.status} ${body}`);
              }
            }
